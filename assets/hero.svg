<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#hero-grad)"/>
  <circle cx="700" cy="80" r="120" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="100" cy="420" r="160" fill="#ffffff" fill-opacity="0.08"/>
  
  <!-- Dashboard Preview Window -->
  <g transform="translate(100, 70)">
    <rect width="600" height="360" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="30" cy="30" r="6" fill="#ef4444"/>
    <circle cx="50" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="30" r="6" fill="#10b981"/>
    <line x1="20" y1="55" x2="580" y2="55" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

    <!-- Left sidebar items -->
    <rect x="25" y="80" width="120" height="24" rx="6" fill="#6366f1" fill-opacity="0.3"/>
    <rect x="25" y="115" width="100" height="16" rx="4" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="25" y="140" width="110" height="16" rx="4" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="25" y="165" width="90" height="16" rx="4" fill="#ffffff" fill-opacity="0.15"/>

    <!-- Main Chart / UI -->
    <rect x="170" y="80" width="190" height="110" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="190" y="100" width="60" height="12" rx="4" fill="#a5b4fc"/>
    <text x="190" y="150" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">99.98%</text>
    <text x="190" y="170" font-family="sans-serif" font-size="12" fill="#93c5fd">Uptime Performance</text>

    <rect x="380" y="80" width="190" height="110" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="400" y="100" width="70" height="12" rx="4" fill="#34d399"/>
    <text x="400" y="150" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2.4 ms</text>
    <text x="400" y="170" font-family="sans-serif" font-size="12" fill="#a7f3d0">Avg Response Time</text>

    <!-- Waves / Graph -->
    <path d="M 170 300 Q 230 230, 290 260 T 410 220 T 530 200 L 530 310 L 170 310 Z" fill="#6366f1" fill-opacity="0.25"/>
    <path d="M 170 300 Q 230 230, 290 260 T 410 220 T 530 200" fill="none" stroke="#818cf8" stroke-width="4"/>
  </g>
</svg>
