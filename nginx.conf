worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    # Upstream cluster of Docker containerized Node.js app instances
    upstream nodejs_cluster {
        least_conn;

        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
        server 127.0.0.1:3004;
    }

    # HTTPS Server (Port 443) - Reverse Proxy & Load Balancer
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL Certificates (update paths to your local certificate location)
        ssl_certificate /Users/appsdeveloperdeveloper/hornacis/nginx-certs/nginx-selfsigned.crt;
        ssl_certificate_key /Users/appsdeveloperdeveloper/hornacis/nginx-certs/nginx-selfsigned.key;

        # Redirect plain HTTP requests mistakenly sent to the SSL port
        error_page 497 301 =307 https://$host$request_uri;

        location / {
            proxy_pass http://nodejs_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP Server (Port 80) - Automatically redirect all traffic to HTTPS
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
